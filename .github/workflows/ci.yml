name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.20"

      - name: gofmt
        run: |
          if [ -n "$(gofmt -d .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Test
        run: go test -v -race ./...
