name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: gofmt
        run: |
          if [ -n "$(gofmt -d .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Test
        run: go test -v -race ./...
